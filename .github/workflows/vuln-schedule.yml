name: Scheduled Vulnerability Scan

# The PR-gating vuln job (ci.yml) only runs on pull requests, so a CVE newly
# disclosed against an already-merged dependency is never surfaced. This job
# runs govulncheck daily against the default branch (main) to catch those.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Ensure UI dist exists
        run: make ensure-ui-dist
      # Keep the pin in sync with ci.yml's vuln job.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
      - name: Run govulncheck
        run: govulncheck ./...
