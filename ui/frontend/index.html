<!doctype html>
<html lang="en" data-theme="northwatch-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d10" />
    <title>northwatch</title>

    <!-- Fonts: JetBrains Mono (the terminal voice) + IBM Plex Sans (prose).
         Loaded best-effort; the CSS stack degrades to system mono/sans when
         the network is unavailable (airgapped deployments stay intentional). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />

    <!-- Apply the stored theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('northwatch-theme');
          var legacy = { light: 'northwatch-light', dark: 'northwatch-dark' };
          var theme = legacy[stored] || stored || 'northwatch-dark';
          if (theme !== 'northwatch-light' && theme !== 'northwatch-dark') {
            theme = 'northwatch-dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* localStorage unavailable — keep the default */
        }
      })();
    </script>
  </head>
  <body class="min-h-screen bg-base-200">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
