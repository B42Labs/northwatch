version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
    - gosec
    - revive
    - bodyclose
    - noctx
    - govet
    - ineffassign
    - unused
    - depguard
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    # Enforce the layering acceptance criterion: only the HTTP layer itself
    # (internal/api + handlers), the startup wiring (internal/app), the spec
    # builder (internal/openapi) and the command entrypoints (cmd) may import
    # internal/api. Lower layers must depend on internal/ovsdb for the OVSDB
    # model-map helpers instead, so an import cycle can never form.
    depguard:
      rules:
        no-http-layer-inversion:
          list-mode: lax
          files:
            - "!**/internal/api/**"
            - "!**/internal/app/**"
            - "!**/internal/openapi/**"
            - "!**/cmd/**"
          deny:
            - pkg: github.com/b42labs/northwatch/internal/api
              desc: lower layers must not import the HTTP layer; OVSDB model-map helpers live in internal/ovsdb
  exclusions:
    paths:
      - internal/ovsdb/nb
      - internal/ovsdb/sb
      - internal/ovsdb/vs
      # Vendored Go sources under node_modules (e.g. flatted/golang) are not
      # ours to lint; shield the local `make lint` run from them.
      - ui/frontend/node_modules
    generated: strict

# Enforce gofmt so formatting drift cannot re-accumulate: `golangci-lint run`
# (both `make lint` and the CI lint job) now fails on unformatted code.
formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/ovsdb/nb
      - internal/ovsdb/sb
      - internal/ovsdb/vs
      - ui/frontend/node_modules
    generated: strict
