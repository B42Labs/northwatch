name: northwatch
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: B42Labs <info@b42labs.com>
description: Real-time Analyzer, Visualizer, Debugger, Configurator, Telemetry & Monitoring for OVN.
vendor: B42Labs
homepage: https://github.com/B42Labs/northwatch
license: Apache-2.0

# The binary itself needs nothing: static (CGO_ENABLED=0, pure-Go
# modernc.org/sqlite) with the UI embedded. adduser is the one dependency —
# postinstall.sh calls addgroup/adduser, which minimal images may not ship.
depends:
  - adduser

contents:
  - src: ./bin/northwatch-linux-${GOARCH}
    dst: /usr/bin/northwatch
    expand: true
    file_info:
      mode: 0755

  - src: ./packaging/northwatch.service
    dst: /lib/systemd/system/northwatch.service

  - src: ./packaging/northwatch.default
    dst: /etc/default/northwatch
    type: config|noreplace          # never clobber operator edits on upgrade
    file_info:
      # Documented home for credentials (OS_PASSWORD, webhook tokens, KUBECONFIG):
      # keep it off the default world-readable 0644. systemd reads EnvironmentFile=
      # as root before dropping to the northwatch user, so 0640 root:northwatch is
      # enough. postinstall.sh creates the group and re-applies this ownership —
      # the group does not exist yet when dpkg unpacks a fresh install.
      mode: 0640
      owner: root
      group: northwatch

  # State directory (SQLite history DB). Owned by the package, not left to the
  # unit's StateDirectory=: dpkg then tracks it, and it already exists when
  # postinstall.sh runs adduser --home, which would otherwise report the home
  # directory as inaccessible. Same unpack-time caveat as the conffile above —
  # postinstall.sh re-applies the ownership.
  - dst: /var/lib/northwatch
    type: dir
    file_info:
      mode: 0750
      owner: northwatch
      group: northwatch

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove:   ./packaging/preremove.sh
  postremove:  ./packaging/postremove.sh
