name: northwatch
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: B42Labs <info@b42labs.com>
description: Real-time Analyzer, Visualizer, Debugger, Configurator, Telemetry & Monitoring for OVN.
vendor: B42Labs
homepage: https://github.com/B42Labs/northwatch
license: Apache-2.0

# No depends: static binary (CGO_ENABLED=0, pure-Go modernc.org/sqlite), embedded UI.

contents:
  - src: ./bin/northwatch-linux-${GOARCH}
    dst: /usr/bin/northwatch
    expand: true
    file_info:
      mode: 0755

  - src: ./packaging/northwatch.service
    dst: /lib/systemd/system/northwatch.service

  - src: ./packaging/northwatch.default
    dst: /etc/default/northwatch
    type: config|noreplace          # never clobber operator edits on upgrade
    file_info:
      # Documented home for credentials (OS_PASSWORD, webhook tokens, KUBECONFIG):
      # keep it off the default world-readable 0644. systemd reads EnvironmentFile=
      # as root before dropping to the northwatch user, so 0640 root:northwatch is
      # enough. The northwatch group is created by postinstall.sh.
      mode: 0640
      owner: root
      group: northwatch

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove:   ./packaging/preremove.sh
  postremove:  ./packaging/postremove.sh
